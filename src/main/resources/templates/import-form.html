
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Import</title>
    <link th:href="@{/resources/style.css}" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:src="@{/resources/load-chapter.js}"></script>
    <script th:src="@{/resources/load-coordinates.js}"></script>
</head>
<body>
    <div class="header">
        <a href="/home">Главная</a>
        <span th:text="${username}"></span>
        <form id="logout-form" action="#" th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit">Logout</button>
        </form>
    </div>
    
    <h1>Импорт данных</h1>
    
    <div class="import-form">
        <form th:action="@{/import}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Выберите JSON файл:</label>
                <input type="file" id="file" name="file" accept=".xml" required>
            </div>
            <button type="submit">Импортировать</button>
        </form>
    </div>

    
</body>
</html>
